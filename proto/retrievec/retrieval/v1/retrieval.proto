syntax = "proto3";
package retrievec.retrieval.v1;
option go_package = "retrievec/engine/gen/retrieval/v1;retrievalv1";

enum QueryMode { QUERY_MODE_UNSPECIFIED = 0; FREE_TEXT = 1; STRUCTURED = 2; }
message SnapshotRequest { string collection_id = 1; string snapshot_id = 2; }
message SearchRequest {
 string collection_id = 1; string snapshot_id = 2; string query = 3;
 QueryMode mode = 4; uint32 candidate_limit = 5; bool explain = 6;
}
message Contribution { string term = 1; double score = 2; uint32 tf = 3; uint32 df = 4; }
message Hit {
 uint32 rank = 1; string chunk_id = 2; string paper_id = 3;
 string paper_version_id = 4; double score = 5; repeated Contribution contributions = 6;
}
message Configuration { string scoring_version = 1; double k1 = 2; double b = 3; }
message SearchResponse {
 string snapshot_id = 1; string corpus_snapshot_id = 2; string analyzer_version = 3;
 Configuration configuration = 4; uint64 total_matches = 5;
 repeated Hit hits = 6; double search_ms = 7;
}
message SnapshotInfo {
 string snapshot_id = 1; string corpus_snapshot_id = 2; string collection_id = 3;
 string analyzer_version = 4; uint64 chunk_count = 5; uint64 term_count = 6;
 uint64 total_tokens = 7; double average_length = 8; repeated string capabilities = 9;
}
service Retrieval {
 rpc Search(SearchRequest) returns (SearchResponse);
 rpc GetSnapshotInfo(SnapshotRequest) returns (SnapshotInfo);
 rpc PrepareSnapshot(SnapshotRequest) returns (SnapshotInfo);
}
