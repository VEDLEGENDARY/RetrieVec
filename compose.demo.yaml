name: retrievec-demo
services:
  init:
    image: python:3.13.15-slim-bookworm
    network_mode: none
    command: [python, /demo/init.py]
    volumes:
      - ./demo/init.py:/demo/init.py:ro
      - settings:/settings
      - store:/store
      - cache:/cache
  postgres:
    image: postgres:18.3
    depends_on:
      init: {condition: service_completed_successfully}
    environment:
      POSTGRES_DB: retrievec
      POSTGRES_USER: retrievec
      POSTGRES_PASSWORD_FILE: /settings/postgres-password
    volumes:
      - settings:/settings:ro
      - database:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U retrievec -d retrievec]
      interval: 2s
      timeout: 5s
      retries: 30
  workspace:
    build: .
    depends_on:
      postgres: {condition: service_healthy}
    entrypoint: [python, /app/demo/bootstrap.py]
    environment:
      RETRIEVEC_LOCAL_HTTP: "1"
      RETRIEVEC_ORIGIN: http://127.0.0.1:8000
      RETRIEVEC_OIDC_ISSUER: http://127.0.0.1:8080/realms/retrievec
      RETRIEVEC_OIDC_CLIENT: retrievec
      RETRIEVEC_PRINCIPAL: "*"
    ports: ["127.0.0.1:8000:8000", "127.0.0.1:8080:8080"]
    volumes:
      - settings:/settings:ro
      - store:/app/artifacts/store
      - cache:/app/artifacts/cache
    stop_grace_period: 40s
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=4)"]
      interval: 10s
      timeout: 5s
      start_period: 15m
      retries: 6
  identity:
    image: quay.io/keycloak/keycloak:26.7.4
    depends_on:
      workspace: {condition: service_started}
    network_mode: service:workspace
    command: [start-dev, --import-realm]
    environment:
      KC_HOSTNAME: http://127.0.0.1:8080
      KC_HEALTH_ENABLED: "true"
    healthcheck:
      test: [CMD, bash, -ec, "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3; grep -q '200' <&3"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 30
    volumes:
      - ./demo/realm.json:/opt/keycloak/data/import/retrievec-realm.json:ro
      - identity:/opt/keycloak/data
    mem_limit: 1g
volumes:
  settings:
  store:
  cache:
  database:
  identity:
