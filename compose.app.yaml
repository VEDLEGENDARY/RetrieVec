services:
  postgres:
    image: postgres:18.3
    restart: unless-stopped
    environment:
      POSTGRES_DB: retrievec
      POSTGRES_USER: retrievec
      POSTGRES_PASSWORD: ${RETRIEVEC_DB_PASSWORD:?Copy .env.example to .env and set a password}
    volumes:
      - registry-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retrievec -d retrievec"]
      interval: 3s
      timeout: 5s
      retries: 30

  workspace:
    build:
      context: .
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RETRIEVEC_DSN: postgresql://retrievec:${RETRIEVEC_DB_PASSWORD}@postgres:5432/retrievec
      RETRIEVEC_PRINCIPAL: "*"
      RETRIEVEC_READ_TOKEN: ${RETRIEVEC_READ_TOKEN:?Set a read token}
      RETRIEVEC_WORKER_TOKEN: ${RETRIEVEC_WORKER_TOKEN:?Set a worker token}
      RETRIEVEC_ORIGIN: ${RETRIEVEC_ORIGIN:-http://127.0.0.1:8000}
      RETRIEVEC_OIDC_ISSUER: ${RETRIEVEC_OIDC_ISSUER:?Set the public OIDC issuer URL}
      RETRIEVEC_OIDC_CLIENT: retrievec
      RETRIEVEC_OIDC_SECRET: ${RETRIEVEC_OIDC_SECRET:-}
      RETRIEVEC_LOCAL_HTTP: ${RETRIEVEC_LOCAL_HTTP:-1}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - artifact-data:/app/artifacts/store
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777

volumes:
  registry-data:
  artifact-data:
