services:
  identity:
    image: quay.io/keycloak/keycloak:26.7.4
    command: [start-dev, --import-realm]
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./artifacts/identity/retrievec-realm.json:/opt/keycloak/data/import/retrievec-realm.json:ro
      - identity-data:/opt/keycloak/data
    mem_limit: 1g
volumes:
  identity-data:
