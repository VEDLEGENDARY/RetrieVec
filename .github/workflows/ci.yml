name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    name: Container build and installed frontend
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: docker build -t retrievec:ci .
      - name: Smoke test installed image as its nonroot user
        run: >-
          docker run --rm --read-only --tmpfs /tmp
          -e RETRIEVEC_DSN=unused -e RETRIEVEC_LOCAL_HTTP=1
          --entrypoint python retrievec:ci -c
          "import os; from fastapi.testclient import TestClient; from retrievec.app.main import create_app; assert os.getuid() != 0; client = TestClient(create_app()); assert client.get('/').status_code == 200; assert client.get('/healthz').status_code == 200; assert client.get('/api/v1/collections').status_code == 401"

  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: engine/go.mod
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: python/requirements-dev.txt
      - name: Install development tools
        run: python -m pip install -r python/requirements-dev.txt
      - name: Install Python package
        run: python -m pip install --no-build-isolation --no-deps -e ./python
      - name: Verify OpenAPI contract has no unreviewed drift
        run: python -m retrievec.contracts --check
      - name: Check workspace on Linux with race detector
        if: runner.os == 'Linux'
        run: python scripts/check.py --race
      - name: Check workspace on Windows
        if: runner.os == 'Windows'
        run: python scripts/check.py

  integration:
    name: PostgreSQL and RPC integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_USER: retrievec
          POSTGRES_DB: retrievec
          POSTGRES_PASSWORD: integration-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U retrievec -d retrievec"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      RETRIEVEC_TEST_DSN: postgresql://retrievec:integration-only@127.0.0.1:5432/retrievec
      RETRIEVEC_VECTOR_TEST_DSN: postgresql://retrievec:integration-only@127.0.0.1:5432/retrievec
      RETRIEVEC_DSN: postgresql://retrievec:integration-only@127.0.0.1:5432/retrievec
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: engine/go.mod
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.15'
      - run: python -m pip install -r python/requirements-dev.txt
      - run: python -m pip install --no-build-isolation --no-deps -e ./python
      - run: python scripts/check.py --race
      - run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
      - run: go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - run: python scripts/generate_rpc.py
      - run: git diff --exit-code -- engine/gen python/src/retrievec/retrieval
      - run: python scripts/demo_hybrid.py --output artifacts/ci-hybrid
      - run: go test ./internal/query -fuzz=FuzzParse -fuzztime=3s
        working-directory: engine
      - run: go test ./internal/segment -fuzz=FuzzOpen -fuzztime=3s
        working-directory: engine
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.1.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: contracts
      - run: npm test
        working-directory: contracts
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx prettier --check src tests ui-tests playwright.config.ts playwright.ui.config.ts vite.config.ts
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm test
        working-directory: web
        env:
          RETRIEVEC_ENGINE: ${{ github.workspace }}/artifacts/bin/retrievald
      - run: npm run test:ui
        working-directory: web
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: workspace-browser-evidence
          path: web/test-results/
          retention-days: 7
