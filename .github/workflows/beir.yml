name: BEIR subset regression

on:
  pull_request:
    paths:
      - 'engine/**'
      - 'python/**'
      - 'scripts/benchmark_beir.py'
      - 'experiments/beir-grid-v1.json'
      - '.github/workflows/beir.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  subset:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: engine/go.mod
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.15'
      - run: python -m pip install -r python/requirements-dev.txt
      - run: python -m pip install --no-build-isolation --no-deps -e ./python
      - run: go build -C engine -o ../artifacts/bin/retrievald ./cmd/retrievald
      - name: Exercise real import, index, ranking, tuning and report paths
        run: python scripts/benchmark_beir.py --documents 100 --queries 3 --embedding fixture --work artifacts/beir-smoke --output artifacts/beir-smoke.json
      - name: Require complete smoke output without claiming model quality
        run: >-
          python -c "import json; r=json.load(open('artifacts/beir-smoke.json'));
          assert r['complete'] and not r['quality_evidence'];
          assert set(r['datasets']) == {'scifact', 'scidocs'};
          assert all(d['query_count'] == 3 and len(d['runs']) == 5 for d in r['datasets'].values())"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: beir-subset-smoke
          path: artifacts/beir-smoke.json
          retention-days: 7
