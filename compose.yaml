services:
  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_DB: retrievallab
      POSTGRES_USER: retrievallab
      POSTGRES_PASSWORD: ${RETRIEVALLAB_DB_PASSWORD:?Set a local database password}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - registry-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retrievallab -d retrievallab"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  registry-data:
