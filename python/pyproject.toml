[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retrievec"
version = "0.1.0"
description = "Corpus preparation and evaluation tooling for RetrieVec"
requires-python = ">=3.13"
dependencies = ["pypdf==6.18.1", "psycopg[binary]==3.3.5", "grpcio==1.84.0", "protobuf==7.36.2", "numpy==2.5.3", "onnxruntime==1.30.0", "tokenizers==0.23.2", "huggingface-hub==1.32.0"]

[project.optional-dependencies]
extraction = ["pydantic==2.13.5"]
app = ["fastapi==0.141.1", "uvicorn==0.53.0", "authlib==1.8.0", "httpx==0.28.1", "python-multipart==0.0.32"]

[tool.setuptools.package-data]
"retrievec.registry" = ["migrations/*.sql"]

[project.scripts]
retrievec = "retrievec.cli:main"
retrievec-api = "retrievec.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
extend-exclude = ["python/src/retrievec/retrieval"]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
