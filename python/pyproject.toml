[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retrievallab"
version = "0.1.0"
description = "Corpus preparation and evaluation tooling for RetrieVec"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
retrievallab = "retrievallab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
